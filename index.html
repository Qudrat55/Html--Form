<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
</head>
<body>

<h2>Contact Form</h2>

<form id="contactForm">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Message:</label><br>
    <textarea name="message" required></textarea><br><br>

    <button type="submit">Submit</button>
</form>

<p id="response"></p>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = {
        name: this.name.value,
        email: this.email.value,
        message: this.message.value
    };

    fetch("https://script.google.com/macros/s/AKfycbycm7zHeAuHAuMFi7fGYhwK0bcp22CeJzbCf8Vrp4Kfw6TT_ddgmD4WAT3w1RY6cPzN/exec", {
        method: "POST",
        body: JSON.stringify(formData)
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("response").innerText = "Form submitted successfully!";
        this.reset();
    })
    .catch(err => {
        document.getElementById("response").innerText = "Error submitting form.";
    });
});
</script>

</body>
</html>
